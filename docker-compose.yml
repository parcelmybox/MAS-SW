services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
      TZ: Asia/Muscat
      PGTZ: Asia/Muscat
    ports:
      - "5432:5432"
    volumes:
      - mas_leads_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mas_leads_pg:
